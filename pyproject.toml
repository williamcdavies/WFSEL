[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "WFSEL"
version = "1.0"
authors = [
  { name="William Chuter-Davies", email="wchuterdavies@unr.edu" },
]
dependencies = [
  "geopandas    >= 1.1.4",
  "matplotlib   >= 3.11.2",
  "netcdf4      >= 1.7.4",
  "numpy        >= 2.5.3",
  "pandas       >= 3.0.6",
  "psycopg      >= 3.3.6",
  "pygam        >= 0.12.0"
  "rasterio     >= 1.5.1",
  "scipy        >= 1.16.3",
  "shapely      >= 2.1.2",
  "sqlalchemy   >= 2.1.1",
  "tqdm         >= 4.68.3",
  "xarray       >= 2026.4.0"
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]