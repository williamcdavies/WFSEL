[build-system]
requires        = ["hatchling >= 1.26"]
build-backend   = "hatchling.build"

[project]
name            = "WFSEL"
version         = "1.0"
authors         = [{name = "William Chuter-Davies", email = "wchuterdavies@unr.edu"}]
requires-python = ">= 3.14"
dependencies    = [
                    "geopandas",
                    "matplotlib",
                    "netcdf4",
                    "numpy",
                    "pandas",
                    "psycopg",
                    "rasterio",
                    "sqlalchemy",
                    "tqdm",
                    "xarray",
                ]

[dependency-groups]
linting = ["ruff", "sqlfluff"]
all     = [{include-group = "linting"}]

[tool.ruff]
indent-width    = 4
line-length     = 79

[tool.ruff.lint]
select  = ["ALL"]
ignore  = [
            "CPY001",
            "D205",
            "D104",
            "E501",
            "I001",
            "INP001",
            "PD004",
            "RET504",
            "S603",
            "TC001",
            "TC002",
            "TC003",
        ]

[tool.ruff.lint.pydocstyle]
convention  = "numpy"

[tool.sqlfluff.core]
dialect         = "postgres"
warnings        = ["layout.long_lines"]
exclude_rules   = ["layout.spacing", "references.quoting"]
