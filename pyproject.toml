[build-system]
requires        = ["hatchling >= 1.26"]
build-backend   = "hatchling.build"

[project]
name            = "wfsel"
version         = "0.1.0"
description     = "..."
license         = {file = "LICENSE"}
authors         = [{name = "William Chuter-Davies", email = "wchuterdavies@unr.edu"}]
requires-python = ">= 3.14"
dependencies    = [
                    "geopandas      >= 1.2.0",
                    "matplotlib     >= 3.11.2",
                    "netcdf4        >= 1.7.5",
                    "numpy          >= 2.5.4",
                    "pandas         >= 3.1.0",
                    "psycopg        >= 3.3.6",
                    "python-dotenv  >= 1.2.4",
                    "rasterio       >= 1.5.2",
                    "requests       >= 2.34.2",
                    "scipy          >= 1.18.1",
                    "sqlalchemy     >= 2.1.6",
                    "tqdm           >= 4.70.1",
                    "xarray         >= 2026.9.0",
                ]

[dependency-groups]
linting = [
            "ruff",
            "sqlfluff",
        ]
testing = [
            "pytest"
        ]
all     = [
            {include-group = "linting"},
            {include-group = "testing"},
        ]

[tool.ruff]
indent-width    = 4
line-length     = 79

[tool.ruff.lint]
select  = ["ALL"]
ignore  = [
            "CPY001",
            "D104",
            "D205",
            "D400",
            "I001",
            "INP001",
            "PD004",
            "RET504",
            "TC001",
            "TC002",
            "TC003",
        ]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.sqlfluff.core]
dialect         = "postgres"
warnings        = ["layout.long_lines"]
exclude_rules   = [
                    "layout.spacing",
                    "references.quoting",
                ]
