[build-system]
build-backend = "hatchling.build"
requires      = [
  "hatchling >= 1.26",
]

[project]
authors         = [
  {
    name  = "William Chuter-Davies",
    email = "wchuterdavies@unr.edu",
  }
]
dependencies    = [
  "geopandas",
  "matplotlib",
  "netcdf4",
  "numpy",
  "pandas",
  "psycopg",
  "rasterio",
  "scipy",
  "shapely",
  "sqlalchemy",
  "tqdm",
  "xarray",
]
name            = "WFSEL"
readme          = "README.md"
requires-python = ">= 3.14"
version         = "1.0"

[dependency-groups]
all     = [
  {include-group = "linting"},
  {include-group = "testing"},
]
linting = [
  "ruff",
  "sqlfluff",
]
testing = [
  "pytest",
]

[tool.sqlfluff.core]
dialect       = "postgres"
exclude_rules = [
  "layout.spacing",
  "references.quoting",
]
warnings      = [
  "layout.long_lines",
]

[tool.ruff]
line-length  = 72
indent-width = 4

[tool.ruff.lint]
ignore = [
  "CPY001",
  "D205",
  "D104",
  "E501",
  "I001",
  "INP001",
  "PD004",
  "RET504",
  "S603",
  "TC001",
  "TC002",
  "TC003",
]
select = [
  "ALL",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
